<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Documento sin título</title>
</head>
<body>
	
	<link rel="stylesheet" href="Estilo_contacto.css">
	<div class="card">
    <h2>Registro de Visitantes</h2>
    <p>Si te interesa mi trabajo, por favor deja tus datos:</p>
    <form action="registrar.php" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <input type="text" name="nombre" placeholder="Tu Nombre" required 
               style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white;">
        
        <input type="email" name="correo" placeholder="Correo Electrónico" required 
               style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white;">
        
        <textarea name="comentarios" placeholder="Comentarios sobre el portafolio" rows="4" required 
                  style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; resize: none;"></textarea>
        
        <button type="submit" style="padding: 12px; border-radius: 8px; border: none; background: #00bcd4; color: black; font-weight: bold; cursor: pointer; transition: 0.3s;">
            Enviar Registro
        </button>
    </form>
</div>	
	
	
</body>
</html>
